{% macro badge(par) -%}<span class="badge {{ par[1] }}">{{ par[0] }}</span>{%- endmacro %}

{% macro field_error(erros, campo) -%}
{% if erros and erros.get(campo) %}<div class="erro-msg">{{ erros[campo] }}</div>{% endif %}
{%- endmacro %}

{% macro csrf() -%}<input type="hidden" name="_csrf" value="{{ csrf_token() }}">{%- endmacro %}
