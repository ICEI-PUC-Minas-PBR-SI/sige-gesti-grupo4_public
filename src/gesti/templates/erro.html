{% extends "base.html" if g.user else "erro_simples.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="empty" style="padding:80px 10px">
  <div class="mono muted-2" style="font-size:40px">{{ codigo }}</div>
  <h1 style="margin:10px 0">{{ titulo }}</h1>
  <p class="muted">{{ texto }}</p>
  <a class="btn" href="{{ url_for('dashboard.index') }}">Voltar ao Dashboard</a>
</div>
{% endblock %}
